name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整历史来取每份报告的上传日期

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure poppler (PDF -> images)
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi
          pdftoppm -v 2>&1 | head -1

      - name: Generate reports.json and page images
        run: python scripts/generate_index.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html report.html reports.json _site/
          cp -r assets _site/
          # 只发布页面图片；原始 PDF 不对外（仅转换失败的回退文件放行）
          [ -d site_images ] && cp -r site_images _site/
          [ -d site_public ] && cp -r site_public _site/
          touch _site/.nojekyll
          ls _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
