<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noarchive">
  <title>技术扫描报告库</title>
  <link rel="stylesheet" href="assets/style.css?v=5">
  <link rel="icon" type="image/svg+xml" href="assets/logo-g-favicon.svg">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="brand">
        <span class="logo"><img src="assets/logo-g.svg" alt="G"></span>
        <div>
          <h1 id="site-title">技术扫描报告库</h1>
          <p class="sub-en" id="site-sub">Tech Scan Report Hub</p>
        </div>
      </div>
      <p class="desc" id="site-desc"></p>
      <div class="stats">
        <span id="stats-main" style="display:contents"></span>
        <span class="stat" id="stat-views" hidden>👁 <b>—</b> 次访问</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" type="search" placeholder="🔍 搜索报告名称…" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <div class="big">📭</div>
      <p>没有找到匹配的报告</p>
    </div>

    <section class="feedback">
      <h2>💬 反馈与点评</h2>
      <p class="hint">对站点整体的建议直接在下方留言；每份报告的点评请进入该报告页面底部留言。两个渠道的留言都保存在 GitHub Discussions，站长会逐一回复。</p>
      <h3 class="disc-title">📖 各报告反馈一览（点击查看对应讨论）</h3>
      <div id="disc-index" class="disc-index"></div>
      <h3 class="disc-title">✍️ 站点总体反馈</h3>
      <div id="giscus-home"></div>
      <p class="ghlink"><a id="gh-disc-link" href="#" target="_blank" rel="noopener">在 GitHub 查看全部讨论 →</a></p>
    </section>
  </main>

  <footer class="wrap">
    <p id="foot-text">
      报告仅供在线浏览 · 支持在报告页与首页两处反馈<br>
      Powered by GitHub Pages
    </p>
  </footer>

  <script src="assets/config.js?v=3"></script>
  <script src="assets/app.js?v=5"></script>
</body>
</html>
